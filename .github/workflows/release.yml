name: Publish to PyPI

on:
  push:
    tags:
      # PEP 440 style: 0.1.6
      - "[0-9]*.[0-9]*.[0-9]*"
      # Optional prefix: v0.1.6
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      # Must match the "Environment name" configured on PyPI (Trusted Publishing).
      # Create under: Repository → Settings → Environments → New environment → pypi
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl python -c "import approck_sqlalchemy_utils as p; print(p.__version__)"

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import approck_sqlalchemy_utils as p; print(p.__version__)"

      - name: Publish to PyPI
        run: uv publish
